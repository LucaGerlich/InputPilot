name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Build and test
        run: |
          xcodebuild -project InputPilot.xcodeproj \
            -scheme InputPilot \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            build test
