name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pinned to the image and Xcode that releases are built with; bump both
    # deliberately rather than inheriting a new macOS or an Xcode beta.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build and test
        run: |
          xcodebuild -project InputPilot.xcodeproj \
            -scheme InputPilot \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            build test
